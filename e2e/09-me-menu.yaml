# The Me tab opens a menu: Profile, Achievements, Account, Info.
appId: com.turftrack.poc
tags: [me]
---
- runFlow: subflows/launch.yaml
- tapOn: { id: 'tab-me' }
- tapOn: { id: 'me-menu-profile' }
- assertVisible: { id: 'profile-name' }
- tapOn: { id: 'profile-achievements' }
- assertVisible: { id: 'achievements-count' }
- assertVisible: { id: 'achievement-first-steps' }
- tapOn: 'Back'
- tapOn: 'Back'
- tapOn: { id: 'tab-me' }
- tapOn: { id: 'me-menu-info' }
- assertVisible: { id: 'app-version' }
- tapOn: 'Back'
