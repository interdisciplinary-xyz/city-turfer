<!--
  Social share image (Open Graph / X), 1200×630. Rendered by apps/mobile/tools/brand/render-assets.mjs,
  which fills the {{…}} slots: fonts and images become data URIs, so the page needs no network.
  Colours are brand tokens (packages/brand/src/colors.ts); the brand test checks they stay in sync.
-->
<style>
  @font-face { font-family: 'BigShouldersDisplay-Black'; src: url({{FONT_DISPLAY}}) format('woff2'); }
  @font-face { font-family: 'Barlow'; src: url({{FONT_BODY}}) format('woff2'); }
  @font-face { font-family: 'BarlowSemiCondensed-BlackItalic'; src: url({{FONT_TAGLINE}}) format('woff2'); }
  .frame {
    position: relative; overflow: hidden; width: {{W}}px; height: {{H}}px; box-sizing: border-box;
    background: #0B0D12;
    font-family: 'Barlow', -apple-system, BlinkMacSystemFont, 'SF Pro Text', Roboto, sans-serif; color: #EEF1F7;
  }
  .copy { position: absolute; left: 72px; top: 0; bottom: 0; width: 640px; display: flex; flex-direction: column; justify-content: center; }
  .wordmark { width: 400px; display: block; }
  .tagline { margin: 36px 0 0; font-family: 'BarlowSemiCondensed-BlackItalic', sans-serif; font-size: 66px; line-height: 1.02; letter-spacing: -0.5px; color: #EEF1F7; max-width: 470px; }
  .sub { margin: 24px 0 0; font-size: 26px; line-height: 1.35; color: #D6DAE3; max-width: 560px; }
  .phone {
    position: absolute; right: 70px; top: 70px; width: 330px; border-radius: 44px; overflow: hidden;
    border: 10px solid #151924; box-shadow: 0 0 120px rgba(247, 47, 168, 0.35), 0 30px 80px rgba(0, 0, 0, 0.6);
  }
  .phone img { display: block; width: 100%; }
</style>
<div class="frame">
  <div class="copy">
    <img class="wordmark" src="{{WORDMARK}}" alt="" />
    <p class="tagline">{{HEADLINE}}</p>
    <p class="sub">{{SUB}}</p>
  </div>
  <div class="phone"><img src="{{SCREEN}}" alt="" /></div>
</div>
