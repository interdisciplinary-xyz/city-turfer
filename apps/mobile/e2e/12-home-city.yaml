# Home City: Me → City, search without Polish letters, pick Kraków; the Turf Map and the Record tab
# show it. Then change it from the Record tab's chip (Gdańsk) and clear it, so later flows start
# without a Home City.
appId: com.turftrack.poc
tags: [turf]
---
- runFlow: subflows/launch.yaml
- tapOn: { id: 'tab-me' }
- tapOn: { id: 'me-menu-city' }
- assertVisible: { id: 'city-search' }
- tapOn: { id: 'city-search' }
- inputText: 'krakow'
- assertVisible: { id: 'city-pl-krakow' }
- assertNotVisible: { id: 'city-pl-warsaw' }
- tapOn: { id: 'city-pl-krakow' }
- extendedWaitUntil: { notVisible: { id: 'city-search' }, timeout: 5000 }
- tapOn: { id: 'tab-turf' }
- assertVisible: { id: 'turf-city' }
# iOS exposes the chips' accessibility labels, not their text ("⌂ Kraków").
- assertVisible: 'Show Kraków'
- takeScreenshot: 12-turf-home-city
# The Record tab shows the city at the top and changes it from there.
- tapOn: { id: 'tab-record' }
- assertVisible: 'City: Kraków'
- tapOn: { id: 'record-city' }
- tapOn: { id: 'city-search' }
- inputText: 'gdansk'
- tapOn: { id: 'city-pl-gdansk' }
- extendedWaitUntil: { notVisible: { id: 'city-search' }, timeout: 5000 }
- assertVisible: 'City: Gdańsk'
- takeScreenshot: 12-record-home-city
# Clear the Home City again. Right after a choice the map is still flying to the city and the
# picker's screen is still closing: a tap then can be dropped, so tap again if the picker isn't up.
- waitForAnimationToEnd
- tapOn: { id: 'record-city' }
- runFlow:
    when: { notVisible: { id: 'city-search' } }
    commands:
      - waitForAnimationToEnd
      - tapOn: { id: 'record-city' }
- extendedWaitUntil: { visible: { id: 'city-clear' }, timeout: 5000 }
- tapOn: { id: 'city-clear' }
- extendedWaitUntil: { notVisible: { id: 'city-search' }, timeout: 5000 }
- assertVisible: { id: 'record-city', text: 'Choose your city' }
- tapOn: { id: 'tab-turf' }
- assertVisible: { id: 'turf-pick-city' }
