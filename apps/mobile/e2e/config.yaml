# Maestro suite: regression lock for the app's features (PoC 2026-10-15, v0.2.0 navigation 2026-10-17).
# Run with: e2e/run.sh   (boots simulator, grants location, runs flows in order)
flows:
  - '*.yaml'
executionOrder:
  continueOnFailure: false
  flowsOrder:
    - 01-auth
    - 02-record-run
    - 03-background-recording
    - 04-too-short
    - 05-history-detail
    - 06-turf-map
    - 07-delete-activity
    - 09-me-menu
    - 10-dashboard
    - 11-apple-health
    - 08-sign-out # last: signs out
