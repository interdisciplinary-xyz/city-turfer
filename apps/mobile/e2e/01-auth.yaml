# Mock sign-in: wrong password rejected, demo account accepted, session survives a restart.
appId: com.turftrack.poc
tags: [auth]
---
- stopApp
- clearKeychain
- runFlow: subflows/launch.yaml
- runFlow:
    when: { visible: { id: 'tab-me' } }
    commands:
      - tapOn: { id: 'tab-me' }
      - tapOn: { id: 'me-menu-account' }
      - tapOn: { id: 'sign-out' }
- extendedWaitUntil: { visible: { id: 'sign-in-email' }, timeout: 10000 }
- assertVisible: 'Surf your city. Own your streets.'
- runFlow: { file: subflows/sign-in.yaml, env: { EMAIL: 'admin@cityturfer.com', PASSWORD: 'wrong-password' } }
- assertVisible: { id: 'sign-in-error' }
- runFlow: { file: subflows/sign-in.yaml, env: { EMAIL: 'admin@cityturfer.com', PASSWORD: 'admin1234' } }
- extendedWaitUntil: { visible: { id: 'dashboard-greeting' }, timeout: 20000 }
# Session persists across an app restart
- stopApp
- runFlow: subflows/launch.yaml
- extendedWaitUntil: { visible: { id: 'dashboard-greeting' }, timeout: 20000 }
