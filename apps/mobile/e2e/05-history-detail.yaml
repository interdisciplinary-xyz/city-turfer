# Dashboard shows recent activities; "See all" opens History; detail shows stats and turf gained.
appId: com.turftrack.poc
tags: [history]
---
- runFlow: subflows/launch.yaml
- tapOn: { id: 'tab-dashboard' }
- assertVisible: { id: 'recent-item-0' }
- tapOn: { id: 'dashboard-see-all-activities' }
- assertVisible: 'History'
- assertVisible: { id: 'history-item-0' }
- tapOn: { id: 'history-item-0' }
- extendedWaitUntil: { visible: { id: 'turf-gained' }, timeout: 15000 }
- assertVisible: { text: 'Distance [0-9].*' }
- assertVisible: { text: 'Moving time [0-9].*' }
- runFlow: subflows/back.yaml
- runFlow: subflows/back.yaml
