# Demo history seeds turf; the Turf map shows the summary and type filters.
appId: com.turftrack.poc
tags: [turf]
---
- runFlow: subflows/launch.yaml
- tapOn: { id: 'tab-me' }
- tapOn: { id: 'me-menu-info' }
- scrollUntilVisible: { element: { id: 'seed-demo' } }
- tapOn: { id: 'seed-demo' }
- extendedWaitUntil: { visible: 'Demo history added', timeout: 240000 }
- tapOn: 'OK'
- runFlow: subflows/back.yaml
- tapOn: { id: 'tab-turf' }
- extendedWaitUntil: { visible: { id: 'turf-summary-area' }, timeout: 15000 }
- assertVisible: { text: "[0-9]+\\.[0-9]{2} km²" }
- assertVisible: { text: '[0-9]+ cells · [0-9]+ strong.*' }
- tapOn: { id: 'turf-filter-walk' }
- tapOn: { id: 'turf-filter-run' }
- tapOn: { id: 'turf-filter-walk' }
- tapOn: { id: 'turf-filter-run' }
- takeScreenshot: 06-turf-map
