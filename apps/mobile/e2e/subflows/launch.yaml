# Launch the app. With DEV_URL (dev build) open it through the dev-client link so
# the JS comes from Metro; otherwise launch the installed (release) app.
appId: com.turftrack.poc
---
- runFlow:
    when: { true: '${DEV_URL}' }
    commands:
      - openLink: ${DEV_URL}
- runFlow:
    when: { true: '${!DEV_URL}' }
    commands:
      - launchApp: { stopApp: false }
- extendedWaitUntil:
    { visible: 'Sign in|Zaloguj się|Start .*|Zacznij .*|Continue|Dalej|Hello, .*|Cześć.*', timeout: 60000 }
- runFlow:
    when: { visible: 'Continue|Dalej' }
    commands: [{ tapOn: 'Continue|Dalej' }]
# Dev builds can open the Expo dev menu over the app (Android on its first launch; iOS too after
# some launches), and it swallows taps. Android closes it with Back, iOS with its Close button.
- runFlow:
    when: { platform: Android, visible: 'Toggle performance monitor' }
    commands: [{ pressKey: back }]
- runFlow:
    when: { platform: iOS, visible: 'Toggle performance monitor' }
    commands: [{ tapOn: 'Close' }]
