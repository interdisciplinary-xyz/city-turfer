# Open Me › Account from wherever a flow is (tab bar visible, or one screen deeper).
appId: com.turftrack.poc
---
- runFlow:
    when: { notVisible: { id: 'tab-me' } }
    commands:
      - runFlow: back.yaml
- tapOn: { id: 'tab-me' }
- tapOn: { id: 'me-menu-account' }
- extendedWaitUntil: { visible: { id: 'account-overview' }, timeout: 10000 }
