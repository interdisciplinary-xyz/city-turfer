appId: com.turftrack.poc
---
- tapOn: { id: 'sign-in-email' }
- eraseText: 60
- inputText: ${EMAIL}
# The keyboard's Next key submits the email; a local profile (admin, demo) then asks for its
# password, which gets the focus. Wait for it, then tap it (the keyboard is already up by now).
- pressKey: Enter
- extendedWaitUntil: { visible: { id: 'sign-in-password' }, timeout: 10000 }
- tapOn: { id: 'sign-in-password' }
- eraseText: 60
- inputText: ${PASSWORD}
# Submit via the keyboard's Go key (the button sits under the keyboard).
- pressKey: Enter
# iOS may offer to save the password after a successful sign-in; dismiss it.
- runFlow:
    when: { visible: 'Not Now' }
    commands: [{ tapOn: 'Not Now' }]
