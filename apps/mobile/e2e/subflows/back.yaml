# Go back one screen. iOS: the header's "Back" button ("Wstecz" in Polish). Android: the system back (the header arrow has no label).
appId: com.turftrack.poc
---
- runFlow:
    when: { platform: iOS }
    commands:
      - tapOn: 'Back|Wstecz'
- runFlow:
    when: { platform: Android }
    commands:
      - back
